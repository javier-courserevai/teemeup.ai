<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bob V2 — Mascot Animations</title>
<script src="https://unpkg.com/@lottiefiles/lottie-player@2.0.3/dist/lottie-player.js"></script>
<style>
  :root {
    --purple: #6B3FE8;
    --purple-d: #4817CE;
    --green: #22C55E;
    --dark: #0D0D1A;
    --dark2: #13102A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--dark);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    color: #fff;
    min-height: 100vh;
    padding: 40px 24px;
  }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #8B6FEE, var(--green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    text-align: center;
    font-size: 0.8rem;
    color: #7C7CA0;
    margin-bottom: 40px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    max-width: 700px;
    margin: 0 auto;
  }
  .card {
    background: var(--dark2);
    border: 1px solid rgba(107,63,232,0.2);
    border-radius: 16px;
    padding: 20px 16px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .card:hover {
    border-color: rgba(107,63,232,0.5);
    box-shadow: 0 0 24px rgba(107,63,232,0.15);
  }
  .card.active {
    border-color: var(--green);
    box-shadow: 0 0 32px rgba(34,197,94,0.18);
  }
  lottie-player {
    width: 160px;
    height: 160px;
    display: block;
  }
  .label {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #9C8FCC;
  }
  .card.active .label { color: var(--green); }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #3A3560;
  }
  .card.active .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }

  /* Responsive */
  @media (max-width: 520px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<h1>Bob — AI Caddie</h1>
<p class="subtitle">Teemeup.ai · Agent States · v2</p>

<div class="grid">
  <div class="card" data-file="bob-idle.json">
    <lottie-player src="bob-idle.json" background="transparent" loop autoplay></lottie-player>
    <div class="dot"></div>
    <div class="label">Idle</div>
  </div>
  <div class="card" data-file="bob-listening.json">
    <lottie-player src="bob-listening.json" background="transparent" loop autoplay></lottie-player>
    <div class="dot"></div>
    <div class="label">Listening</div>
  </div>
  <div class="card" data-file="bob-speaking.json">
    <lottie-player src="bob-speaking.json" background="transparent" loop autoplay></lottie-player>
    <div class="dot"></div>
    <div class="label">Speaking</div>
  </div>
  <div class="card" data-file="bob-thinking.json">
    <lottie-player src="bob-thinking.json" background="transparent" loop autoplay></lottie-player>
    <div class="dot"></div>
    <div class="label">Thinking</div>
  </div>
  <div class="card" data-file="bob-connecting.json">
    <lottie-player src="bob-connecting.json" background="transparent" loop autoplay></lottie-player>
    <div class="dot"></div>
    <div class="label">Connecting</div>
  </div>
  <div class="card" data-file="bob-loading.json">
    <lottie-player src="bob-loading.json" background="transparent" loop autoplay></lottie-player>
    <div class="dot"></div>
    <div class="label">Loading</div>
  </div>
</div>

<script>
  // Highlight active card on hover
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('mouseenter', () => {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
    });
    card.addEventListener('mouseleave', () => {
      card.classList.remove('active');
    });
  });
</script>
</body>
</html>
